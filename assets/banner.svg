<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Igor</title>
  <desc id="desc">Python developer, RTU MIREA, Moscow. Python, C, C#, and Lua.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#94a3b8" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow2)"/>
  <rect width="1200" height="340" rx="28" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="26.5" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="72" y="118" fill="#7dd3fc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="5">PYTHON DEVELOPER</text>
  <text x="68" y="202" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700">Igor</text>
  <text x="72" y="252" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">RTU MIREA &#183; Moscow</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="276" width="108" height="34" rx="17" fill="#0b1220" stroke="#334155"/>
    <text x="126" y="298" fill="#e2e8f0" text-anchor="middle">Python</text>
    <rect x="192" y="276" width="52" height="34" rx="17" fill="#0b1220" stroke="#334155"/>
    <text x="218" y="298" fill="#e2e8f0" text-anchor="middle">C</text>
    <rect x="256" y="276" width="64" height="34" rx="17" fill="#0b1220" stroke="#334155"/>
    <text x="288" y="298" fill="#e2e8f0" text-anchor="middle">C#</text>
    <rect x="332" y="276" width="70" height="34" rx="17" fill="#0b1220" stroke="#334155"/>
    <text x="367" y="298" fill="#e2e8f0" text-anchor="middle">Lua</text>
  </g>
</svg>
