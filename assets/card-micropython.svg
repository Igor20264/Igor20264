<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 188" role="img" aria-labelledby="t d">
  <title id="t">NodeMP MicroPython</title>
  <desc id="d">Separate MicroPython host for the NodeMP server.</desc>
  <rect width="520" height="188" rx="18" fill="#0f172a"/>
  <rect x="1" y="1" width="518" height="186" rx="17" fill="none" stroke="#1e293b"/>
  <rect width="7" height="188" rx="3" fill="#14b8a6"/>
  <text x="32" y="40" fill="#5eead4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.4">MICROPYTHON</text>
  <text x="32" y="78" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">NodeMP &#183; MicroPython</text>
  <text x="32" y="114" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">A separate interpreter, beside CPython.</text>
  <text x="32" y="138" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Sandboxed scripts and a lane of their own.</text>
